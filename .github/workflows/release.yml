name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-14
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
          - os: ubuntu-22.04
            label: linux-x64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Generate icons and audio
        run: |
          python tools/make_icons.py
          python tools/make_audio.py

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller --noconfirm --clean
          --name HeadphoneKeepAlive --onefile --windowed
          --icon assets/icon.ico
          --add-data "assets/tray-mask.png:assets"
          --add-data "assets/noise-pink.s16:assets"
          --add-data "assets/noise-brown.s16:assets"
          --add-data "THIRD-PARTY-NOTICES.md:licenses"
          --add-data "licenses/LGPL-3.0.txt:licenses"
          --add-data "licenses/GPL-3.0.txt:licenses"
          --exclude-module numpy
          --exclude-module tkinter
          --exclude-module unittest
          --exclude-module pydoc
          --exclude-module doctest
          --exclude-module ssl
          --exclude-module _ssl
          --exclude-module hashlib
          --exclude-module _hashlib
          --exclude-module dbm
          --exclude-module _dbm
          --exclude-module _gdbm
          --exclude-module bz2
          --exclude-module PIL._avif
          --exclude-module PIL._webp
          --exclude-module PIL._imagingcms
          --exclude-module PIL._imagingft
          --exclude-module PIL._imagingtk
          --exclude-module PIL.ImageQt
          --collect-all sounddevice --collect-all pystray --collect-all PIL
          run.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          python -m PyInstaller --noconfirm --clean
          --name HeadphoneKeepAlive --windowed
          --icon assets/icon.icns
          --add-data "assets/tray-mask.png:assets"
          --add-data "assets/noise-pink.s16:assets"
          --add-data "assets/noise-brown.s16:assets"
          --add-data "THIRD-PARTY-NOTICES.md:licenses"
          --add-data "licenses/LGPL-3.0.txt:licenses"
          --add-data "licenses/GPL-3.0.txt:licenses"
          --exclude-module numpy
          --exclude-module tkinter
          --exclude-module unittest
          --exclude-module pydoc
          --exclude-module doctest
          --exclude-module ssl
          --exclude-module _ssl
          --exclude-module hashlib
          --exclude-module _hashlib
          --exclude-module dbm
          --exclude-module _dbm
          --exclude-module _gdbm
          --exclude-module bz2
          --exclude-module PIL._avif
          --exclude-module PIL._webp
          --exclude-module PIL._imagingcms
          --exclude-module PIL._imagingft
          --exclude-module PIL._imagingtk
          --exclude-module PIL.ImageQt
          --osx-bundle-identifier com.brunoric3d.headphonekeepalive
          --collect-all sounddevice --collect-all pystray --collect-all PIL
          run.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          PORTAUDIO=$(ldconfig -p | grep -m1 'libportaudio\.so\.2' | awk '{print $NF}')
          echo "bundling $PORTAUDIO"
          python -m PyInstaller --noconfirm --clean \
            --name HeadphoneKeepAlive --onefile \
            --add-data "assets/tray-mask.png:assets" \
            --add-data "assets/noise-pink.s16:assets" \
            --add-data "assets/noise-brown.s16:assets" \
            --add-data "THIRD-PARTY-NOTICES.md:licenses" \
            --add-data "licenses/LGPL-3.0.txt:licenses" \
            --add-data "licenses/GPL-3.0.txt:licenses" \
            --exclude-module numpy \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            --exclude-module ssl \
            --exclude-module _ssl \
            --exclude-module hashlib \
            --exclude-module _hashlib \
            --exclude-module dbm \
            --exclude-module _dbm \
            --exclude-module _gdbm \
            --exclude-module bz2 \
            --exclude-module PIL._avif \
            --exclude-module PIL._webp \
            --exclude-module PIL._imagingcms \
            --exclude-module PIL._imagingft \
            --exclude-module PIL._imagingtk \
            --exclude-module PIL.ImageQt \
            --add-binary "$PORTAUDIO:." \
            --collect-all sounddevice --collect-all pystray --collect-all PIL \
            run.py

      - name: Stage the executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Move-Item dist/HeadphoneKeepAlive.exe out/HeadphoneKeepAlive-${{ matrix.label }}.exe

      - name: Stage the executable (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out
          # ditto e o zip correto para um .app: preserva links e permissoes
          ditto -c -k --sequesterRsrc --keepParent \
            dist/HeadphoneKeepAlive.app \
            out/HeadphoneKeepAlive-${{ matrix.label }}.zip

      - name: Stage the executable (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          mv dist/HeadphoneKeepAlive out/HeadphoneKeepAlive-${{ matrix.label }}
          chmod +x out/HeadphoneKeepAlive-${{ matrix.label }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HeadphoneKeepAlive-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
